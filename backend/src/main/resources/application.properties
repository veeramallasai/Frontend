# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/farmtohome
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Multipart upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Product image upload directory
app.upload.product-dir=uploads/products

# Google Maps Routes API configuration (backend only; key is read from env variable)
google.maps.routes-api-key=${GOOGLE_ROUTES_API_KEY}
google.maps.routes-url=https://routes.googleapis.com/directions/v2:computeRoutes

# JWT authentication configuration
app.security.jwt.secret=${JWT_SECRET:change-this-default-jwt-secret-key-to-a-strong-256-bit-secret-change-this}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
