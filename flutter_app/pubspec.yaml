name: farmtohome_frontend
description: "A complete production-ready Flutter frontend application for FarmToHome e-commerce."
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # HTTP request client
  http: ^1.2.1

  # Local token/settings storage
  shared_preferences: ^2.2.3

  # Formatting numbers, dates
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
