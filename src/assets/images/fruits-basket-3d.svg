<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <defs>
    <filter id="fruitShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.12" />
    </filter>

    <linearGradient id="basketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <linearGradient id="greenAppleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <linearGradient id="pineappleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="grapeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="250" cy="360" rx="190" ry="18" fill="#000000" opacity="0.12" />

  <g filter="url(#fruitShadow)">
    <!-- GRAPES CLUSTER LEFT -->
    <g transform="translate(100, 240)">
      <circle cx="20" cy="20" r="16" fill="url(#grapeGrad)" />
      <circle cx="40" cy="20" r="16" fill="url(#grapeGrad)" />
      <circle cx="30" cy="38" r="16" fill="url(#grapeGrad)" />
      <circle cx="15" cy="45" r="14" fill="url(#grapeGrad)" />
      <circle cx="45" cy="45" r="14" fill="url(#grapeGrad)" />
      <circle cx="30" cy="62" r="12" fill="url(#grapeGrad)" />
      <circle cx="30" cy="76" r="9" fill="url(#grapeGrad)" />
    </g>

    <!-- BASKET BACK RIMS -->
    <path d="M 120 250 Q 250 210 380 250 L 350 340 Q 250 365 150 340 Z" fill="url(#basketGrad)" opacity="0.9" />

    <!-- PINEAPPLE (BACK RIGHT) -->
    <g transform="translate(290, 100)">
      <!-- Pineapple Crown Leaves -->
      <path d="M 40 40 L 25 -20 L 45 20 L 50 -35 L 55 20 L 75 -20 L 60 40 Z" fill="#15803d" />
      <path d="M 35 30 L 10 -10 L 40 25 L 50 -15 L 60 25 L 85 -10 L 65 30 Z" fill="#22c55e" />
      <!-- Pineapple Body -->
      <rect x="20" y="35" width="60" height="90" rx="30" fill="url(#pineappleGrad)" />
      <path d="M 25 55 L 75 95 M 25 75 L 75 115 M 75 55 L 25 95 M 75 75 L 25 115" stroke="#78350f" stroke-width="2.5" opacity="0.6" />
    </g>

    <!-- BANANAS / GREENS BACK -->
    <g transform="translate(180, 110)">
      <path d="M 40 50 Q 10 0 5 -40 Q 30 10 60 50 Z" fill="#16a34a" />
      <path d="M 50 50 Q 30 -10 30 -50 Q 45 10 70 50 Z" fill="#22c55e" />
      <path d="M 60 50 Q 50 -10 60 -45 Q 65 10 80 50 Z" fill="#4ade80" />
    </g>

    <!-- RED APPLES (MID BASKET) -->
    <circle cx="210" cy="230" r="38" fill="url(#appleGrad)" />
    <!-- Leaf on Red Apple -->
    <path d="M 210 190 Q 225 175 235 185 Q 225 200 210 190 Z" fill="#16a34a" />

    <!-- YELLOW/GREEN APPLES & ORANGES -->
    <circle cx="270" cy="235" r="36" fill="url(#greenAppleGrad)" />
    <circle cx="340" cy="255" r="34" fill="url(#orangeGrad)" />
    <circle cx="160" cy="265" r="32" fill="url(#orangeGrad)" />

    <!-- FRONT APPLES & ORANGES (FRONT ROW) -->
    <circle cx="190" cy="300" r="34" fill="url(#appleGrad)" />
    <circle cx="245" cy="305" r="35" fill="url(#greenAppleGrad)" />
    <circle cx="300" cy="300" r="34" fill="url(#orangeGrad)" />
    <circle cx="350" cy="290" r="28" fill="url(#appleGrad)" />

    <!-- BASKET FRONT WEAVE PATTERN -->
    <path d="M 120 250 C 180 275 320 275 380 250 L 355 338 C 300 365 200 365 145 338 Z" fill="url(#basketGrad)" />
    <!-- Basket Weave Lines -->
    <path d="M 130 270 Q 250 295 370 270 M 138 290 Q 250 315 362 290 M 144 310 Q 250 335 354 310" stroke="#f59e0b" stroke-width="3" opacity="0.4" />
    <path d="M 170 260 L 160 340 M 210 265 L 205 352 M 250 268 L 250 355 M 290 265 L 295 352 M 330 260 L 340 340" stroke="#78350f" stroke-width="3" opacity="0.3" />
  </g>
</svg>
