<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="milkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="eggGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
  </defs>
  <!-- MILK BOTTLE -->
  <rect x="75" y="45" width="50" height="110" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" />
  <!-- Blue Label -->
  <rect x="75" y="85" width="50" height="40" fill="url(#milkGrad)" />
  <!-- Bottle Cap -->
  <rect x="85" y="32" width="30" height="16" rx="6" fill="#0284c7" />
  
  <!-- EGGS -->
  <ellipse cx="60" cy="140" rx="20" ry="25" fill="url(#eggGrad)" stroke="#f97316" stroke-width="2" />
  <ellipse cx="140" cy="142" rx="22" ry="26" fill="url(#eggGrad)" stroke="#f97316" stroke-width="2" />
  <ellipse cx="100" cy="150" rx="18" ry="22" fill="url(#eggGrad)" stroke="#f97316" stroke-width="2" />
</svg>
