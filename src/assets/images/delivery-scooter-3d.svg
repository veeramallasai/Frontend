<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <defs>
    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.15" />
    </filter>
    
    <!-- Helmet Gradient -->
    <linearGradient id="helmetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Visor Gradient -->
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Scooter Green Body Gradient -->
    <linearGradient id="scooterBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>

    <!-- Box Green Gradient -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Wheel Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="270" cy="355" rx="170" ry="16" fill="#000000" fill-opacity="0.12" />

  <g filter="url(#shadow)">
    <!-- BACK WHEEL -->
    <circle cx="140" cy="310" r="42" fill="#1e293b" />
    <circle cx="140" cy="310" r="26" fill="url(#rimGrad)" />
    <circle cx="140" cy="310" r="14" fill="#f8fafc" />
    <circle cx="140" cy="310" r="6" fill="#475569" />

    <!-- FRONT WHEEL -->
    <circle cx="390" cy="310" r="42" fill="#1e293b" />
    <circle cx="390" cy="310" r="26" fill="url(#rimGrad)" />
    <circle cx="390" cy="310" r="14" fill="#f8fafc" />
    <circle cx="390" cy="310" r="6" fill="#475569" />

    <!-- SCOOTER CHASSIS & FLOORBOARD -->
    <path d="M 140 310 L 210 310 L 260 305 L 340 305 C 360 305 375 290 380 270 L 390 230 C 393 218 385 205 372 205 L 340 205 L 315 260 L 220 260 Z" fill="url(#scooterBody)" />

    <!-- REAR MUDGUARD & BODY COWL -->
    <path d="M 95 300 C 95 245 135 220 200 220 C 230 220 250 240 250 280 L 120 310 C 100 310 95 305 95 300 Z" fill="url(#scooterBody)" />

    <!-- SEAT -->
    <path d="M 180 215 C 180 205 195 200 245 200 C 275 200 285 210 285 220 L 175 220 Z" fill="#0f172a" />

    <!-- FRONT STEERING FORK & HANDLEBAR TUBE -->
    <path d="M 390 310 L 375 200 L 350 140" stroke="#64748b" stroke-width="12" stroke-linecap="round" />

    <!-- FRONT HEADLIGHT & FAIRING -->
    <path d="M 335 155 C 335 130 365 125 380 135 C 390 142 390 165 375 170 Z" fill="url(#scooterBody)" />
    <!-- HEADLIGHT LENS -->
    <ellipse cx="380" cy="150" rx="9" ry="14" fill="#fef08a" opacity="0.9" />

    <!-- HANDLEBAR GRIP -->
    <rect x="320" y="132" width="40" height="14" rx="7" fill="#1e293b" />

    <!-- MIRROR -->
    <path d="M 355 135 L 360 105" stroke="#475569" stroke-width="4" stroke-linecap="round" />
    <ellipse cx="362" cy="100" rx="10" ry="7" fill="#94a3b8" />

    <!-- DELIVERY BOX (CARGO RACK) -->
    <rect x="80" y="110" width="115" height="110" rx="16" fill="url(#boxGrad)" stroke="#15803d" stroke-width="3" />
    <!-- BOX LID & LATCH -->
    <rect x="75" y="105" width="125" height="16" rx="8" fill="#166534" />
    
    <!-- LEAF LOGO ON BOX -->
    <g transform="translate(120, 145) scale(1.4)">
      <path d="M 12 2 C 5 2 2 9 2 16 C 2 20 5 23 9 23 C 16 23 20 16 22 10 C 20 4 16 2 12 2 Z" fill="#ffffff" />
      <path d="M 12 4 C 12 10 9 17 4 21" stroke="#22c55e" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- RIDER - LEGS -->
    <!-- Far Leg -->
    <path d="M 230 215 L 260 270 L 300 270" stroke="#1e293b" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- RIDER - BODY (GREEN JACKET) -->
    <path d="M 220 150 C 220 135 240 135 260 145 L 270 215 L 220 215 Z" fill="#166534" />
    <path d="M 225 145 C 235 140 255 140 265 148 L 270 210 L 225 210 Z" fill="#22c55e" />

    <!-- RIDER - ARMS -->
    <path d="M 245 155 L 305 165 L 335 142" stroke="#15803d" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

    <!-- RIDER - HAND -->
    <circle cx="337" cy="140" r="9" fill="#fbcfe8" />

    <!-- RIDER - HEAD & HELMET -->
    <circle cx="242" cy="105" r="26" fill="url(#helmetGrad)" />
    <!-- Helmet visor -->
    <path d="M 248 90 C 265 92 272 105 268 118 L 245 118 Z" fill="url(#visorGrad)" />
    <!-- Helmet strap / accent -->
    <path d="M 220 110 C 230 125 255 125 262 110" stroke="#15803d" stroke-width="4" fill="none" />
    <!-- White Leaf Icon on Helmet -->
    <path d="M 234 98 C 230 98 228 102 228 105 C 228 108 230 110 234 110 C 238 110 240 106 240 101 Z" fill="#ffffff" />
  </g>
</svg>
